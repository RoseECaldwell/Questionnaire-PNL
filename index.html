<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test des métaprogrammes, découvrez votre profil amoureux et ses compatibilités</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Poppins:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d1f1f;
      --card-dark: #162828;
      --button-dark: #222;
      --button-gradient: linear-gradient(90deg,#ff70a6,#36e3e4 60%,#7cf47c 100%);
      --glow: 0 0 6px 2px #36e3e480, 0 0 18px 4px #ff70a680;
      --progress-gradient: linear-gradient(90deg, #ff70a6, #ffe17b 50%, #7cf47c 100%);
      --heart-gradient: linear-gradient(135deg, #1d2c7a 0%, #36e3e4 55%, #ff70a6 100%);
    }
    html, body {
      min-height: 100%;
      background: var(--bg-dark);
      color: #fff;
      font-family: 'Montserrat', 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: flex-start;
      align-items: center;
      background: var(--bg-dark);
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 32px auto 0 auto;
      padding: 0 14px 80px 14px;
      position: relative;
    }
    .header-flex {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 0.7em;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.1em;
      margin-top: 0.4em;
      letter-spacing: -0.01em;
      line-height: 1.3;
      flex: 1 1 auto;
    }
    .heart {
      width: 70px;
      height: 66px;
      margin: 0;
      display: block;
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
    }
    .heart svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .inspiration {
      font-size: 1.07rem;
      line-height: 1.5;
      text-align: center;
      color: #ffe17bcc;
      margin-bottom: 1.7em;
      font-style: italic;
      transition: opacity 0.2s;
    }
    .inspiration.hide {
      opacity: 0;
      pointer-events: none;
      height: 0;
      margin-bottom: 0;
      padding: 0;
    }
    .question-card {
      background: var(--card-dark);
      border-radius: 18px;
      box-shadow: 0 4px 24px #000c  ;
      padding: 34px 22px 28px 22px;
      margin-bottom: 2em;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      transition: opacity 0.3s;
    }
    .question-fade {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .question-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffe17b;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .question-text {
      font-size: 1.12rem;
      font-weight: 500;
      text-align: center;
      color: #fff;
      margin-bottom: 30px;
      margin-top: 0;
    }
    .answers {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-bottom: 0.5em;
      align-items: center;
    }
    .answer-btn {
      width: 95%;
      max-width: 340px;
      padding: 14px 0;
      background: #191f2a;
      border: 2px solid #2b3b3d;
      color: #fff;
      border-radius: 100px;
      font-size: 1.07rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      margin: 0 auto;
      outline: none;
      transition: background 0.23s, box-shadow 0.23s, border-color 0.18s, color 0.18s;
      box-shadow: 0 2px 10px #1116;
      position: relative;
      letter-spacing: 0.03em;
    }
    .answer-btn.selected, .answer-btn:active {
      background: var(--button-gradient);
      color: #0d1f1f;
      border: 2px solid #ffe17b;
      box-shadow: 0 0 0 2px #fff3, 0 0 10px 4px #ffe17b33;
    }
    .answer-btn:hover:not(.selected) {
      background: #2d3c43;
      color: #ffe17b;
      border-color: #36e3e4;
      box-shadow: var(--glow);
    }
    .alert {
      display: none;
      color: #ff70a6;
      background: #fff1;
      border-radius: 8px;
      font-size: 1.06rem;
      margin: 12px 0 0 0;
      padding: 8px 12px;
      text-align: center;
    }
    .show-alert {
      display: block;
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .next-btn {
      display: block;
      margin: 28px auto 0 auto;
      padding: 12px 40px;
      background: var(--button-dark);
      border: none;
      border-radius: 100px;
      color: #fff;
      font-size: 1.13rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 18px 0 #36e3e4a0, 0 0 18px 2px #ff70a6a0;
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px #ff70a6, 0 0 10px #36e3e4;
      background-image: var(--button-gradient);
      background-size: 220% 100%;
      background-position: left center;
      transition: background-position 0.3s, box-shadow 0.23s;
    }
    .next-btn:hover, .next-btn:focus {
      background-position: right center;
      box-shadow: 0 0 24px 2px #7cf47c99, 0 0 24px 6px #ffe17b66;
      outline: none;
    }
    .progress-bar-bg {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 7px;
      background: #1a3434;
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--progress-gradient);
      border-radius: 0 12px 12px 0;
      transition: width 0.4s cubic-bezier(.8,.1,.2,1);
    }
    .result-block {
      background: var(--card-dark);
      border-radius: 16px;
      box-shadow: 0 4px 24px #000c;
      padding: 30px 20px 24px 20px;
      margin: 36px 0 28px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.7s;
      position: relative;
    }
    .email-label {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #ffe17b;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .email-input, .consent-checkbox {
      margin: 10px 0 18px 0;
      width: 96%;
      max-width: 340px;
      padding: 12px;
      border-radius: 6px;
      border: 1.5px solid #36e3e4;
      font-size: 1.07rem;
      font-family: inherit;
      background: #181f20;
      color: #fff;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .email-input:focus {
      border-color: #ff70a6;
    }
    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 1.01rem;
      color: #fff;
    }
    .consent-checkbox {
      width: 20px;
      height: 20px;
      margin: 0 7px 0 0;
      accent-color: #ff70a6;
      cursor: pointer;
    }
    .submit-btn {
      margin: 20px auto 0 auto;
      padding: 13px 44px;
      background: var(--button-dark);
      border: none;
      border-radius: 100px;
      color: #fff;
      font-size: 1.13rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--glow);
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px #ff70a6, 0 0 10px #36e3e4;
      background-image: var(--button-gradient);
      background-size: 220% 100%;
      background-position: left center;
      transition: background-position 0.3s, box-shadow 0.23s;
      display: block;
      position: relative;
    }
    .submit-btn[disabled] {
      opacity: 0.6;
      pointer-events: none;
    }
    .submit-spinner {
      border: 2.5px solid #7cf47c;
      border-top: 2.5px solid #ffe17b;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    @keyframes spin {
      0% { transform: translateY(-50%) rotate(0deg);}
      100% { transform: translateY(-50%) rotate(360deg);}
    }
    .email-duplicate-msg {
      color: #ffe17b;
      background: #ff70a61c;
      border-radius: 7px;
      font-size: 1.06rem;
      margin: 14px 0 0 0;
      padding: 7px 10px;
      text-align: center;
      display: none;
      animation: fadeIn 0.5s;
    }
    .success-msg {
      color: #7cf47c;
      background: #36e3e41a;
      border-radius: 7px;
      font-size: 1.15rem;
      margin: 28px 0 0 0;
      padding: 14px 16px;
      text-align: center;
      display: none;
      animation: fadeIn 0.7s;
    }
    .error-msg {
      color: #ff70a6;
      background: #fff1;
      border-radius: 7px;
      font-size: 1.06rem;
      margin: 18px 0 0 0;
      padding: 8px 12px;
      text-align: center;
      display: block;
      animation: fadeIn 0.5s;
    }
    @media (max-width: 600px) {
      .container { max-width: 100vw; padding: 0 2vw 80px 2vw;}
      .question-card, .result-block { padding: 18px 5vw 18px 5vw;}
      .header-flex { gap: 10px;}
      .heart { width: 46px; height: 44px;}
      h1 { font-size: 1.03rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header flex: Heart + Title -->
    <div class="header-flex">
      <div class="heart">
        <svg viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1d2c7a"/>
              <stop offset="55%" stop-color="#36e3e4"/>
              <stop offset="100%" stop-color="#ff70a6"/>
            </linearGradient>
          </defs>
          <path fill="url(#heartGradient)" d="M30 50.8l-2.9-2.6C12 35 2 26.6 2 16.5 2 8.5 8.47 2 16.5 2 21.2 2 25.7 4.7 28 8.7 30.3 4.7 34.8 2 39.5 2 47.5 2 54 8.5 54 16.5c0 10.1-10 18.5-25.1 31.7L30 50.8z"/>
        </svg>
      </div>
      <h1>Test des métaprogrammes, découvrez votre profil amoureux et ses compatibilités</h1>
    </div>

    <div class="inspiration" id="inspiration-text">Répondez spontanément, il n’y a pas de bonne ou mauvaise réponse.</div>

    <!-- Question Card -->
    <div id="question-card" class="question-card">
      <div class="question-number" id="question-number">1.</div>
      <div class="question-text" id="question-text">
      </div>
      <div class="answers">
        <button class="answer-btn" data-value="0" id="answer-jamais">Jamais</button>
        <button class="answer-btn" data-value="25" id="answer-rarement">Rarement</button>
        <button class="answer-btn" data-value="75" id="answer-souvent">Souvent</button>
        <button class="answer-btn" data-value="100" id="answer-toujours">Toujours</button>
      </div>
      <div class="alert" id="alert">💡 Merci de répondre à la question pour continuer, cela rendra votre profil plus précis ❤️</div>
      <button class="next-btn" id="next-btn">Suivant</button>
    </div>

    <!-- Email & Result Block -->
    <form id="result-block" class="result-block" style="display:none;" autocomplete="off">
      <label for="email" class="email-label">Recevez votre analyse personnalisée par e-mail :</label>
      <input id="email" type="email" class="email-input" name="email" placeholder="Votre adresse e-mail" required autocomplete="email" />
      <div id="email-duplicate-msg" class="email-duplicate-msg"></div>
      <div class="consent-row">
        <input type="checkbox" id="consent" name="consent" class="consent-checkbox" required />
        <label for="consent" style="margin:0;line-height:1.2;">
          Oui, je souhaite recevoir mon analyse par e-mail et rester informé(e) des nouveautés MetaLove, y compris des bonus exclusifs et des prochains livres à paraître.
        </label>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Envoyer</button>
      <span id="submit-spinner" class="submit-spinner" style="display:none;"></span>
      <div id="error-msg" class="error-msg" style="display:none;"></div>
      <div id="success-msg" class="success-msg"></div>
    </form>
  </div>

  <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar"></div></div>

  <script>
    // Métaprogrammes :
    //
    // [VAKOG]
    // v : visuel
    // a : auditif
    // k : kinesthésique
    // o : olfactif
    // g : gustatif
    //
    // [Procédure/Option]
    // proc : procédure
    // opt : option
    //
    // [Proactif/Réactif]
    // proa : proactif
    // rea : réactif
    //
    // [Rapport au temps]
    // past : passé
    // now : présent
    // futur : futur
    //
    // [Motivation]
    // pv : pouvoir
    // obj : objectif
    // aff : affiliation
    //
    // [Orientation]
    // vs : vers soi
    // va : vers les autres
    //
    // [Énergie]
    // int : introverti
    // ext : extraverti
    //
    // [Focus]
    // d : détail
    // gbl : global

    // Scores pour chaque métaprogramme
    // Au fur et à mesure des questions et des réponses choisies, on incrémentera la clé correspondante au métaprogramme de la question en cours
    const GLOBAL_SCORES = {
      v: 0,
      a: 0,
      k: 0,
      o: 0,
      g: 0,
      proc: 0,
      opt: 0,
      proa: 0,
      rea: 0,
      past: 0,
      now: 0,
      futur: 0,
      pv: 0,
      obj: 0,
      aff: 0,
      vs: 0,
      va: 0,
      int: 0,
      ext: 0,
      d: 0,
      gbl: 0
    };

    // Liste des pans et des métaprogrammes qu'ils contiennent
    const GLOBAL_PANS = {
      vakog: ["v", "a", "k", "o", "g"],
      proc_opt: ["proc", "opt"],
      proa_rea: ["proa", "rea"],
      temps: ["past", "now", "futur"],
      motiv: ["pv", "obj", "aff"],
      orientation: ["vs", "va"],
      energie: ["int", "ext"],
      focus: ["d", "gbl"]
    };

    // Tableau contenant toutes les questions
    // Accès à une question : 
    // allQuestions[index][0] = métaprogramme (v, a, k, o, g, proc, ...)
    // allQuestions[index][1] = intitulé de la question

      ["v","Vous souvenez-vous plus facilement des visages que des noms ?"],
      ["v","Aimez-vous organiser votre espace de travail de façon esthétique et harmonieuse ?"],
      ["v","Choisissez-vous vos vêtements principalement en fonction de leur apparence visuelle ?"],

      ["a","Lorsque vous entendez une voix familière, la reconnaissez-vous rapidement, même sans voir la personne ?"],

      ["k","Êtes-vous particulièrement sensible à la texture des vêtements que vous portez ?"],
      ["k","Avez-vous du mal à rester concentré(e) sans bouger, même légèrement ?"],
      ["k","Apprenez-vous plus facilement en manipulant ou en expérimentant directement ?"],
      ["k","Avez-vous besoin de ressentir physiquement un lieu pour savoir si vous vous y sentez bien ?"],
      ["k","Évitez-vous certains vêtements, même beaux, s’ils sont trop serrés ou inconfortables ?"],
      ["opt","Aimez-vous avoir plusieurs manières possibles d’aborder une même tâche ?"],
      ["opt","Préférez-vous improviser plutôt que suivre une méthode fixe ?"],
      ["opt","Vous sentez-vous limité(e) lorsqu’on vous impose une seule façon de faire ?"],
      ["opt","Avez-vous tendance à adapter les règles plutôt qu’à les suivre strictement ?"],
      ["opt","Appréciez-vous les formations ouvertes plutôt que très structurées ?"],
      ["proc","Avez-vous besoin de consignes claires avant de commencer une tâche ?"],
      ["proc","Préférez-vous suivre une méthode pas à pas plutôt que d’improviser ?"],

      ["obj","Avez-vous besoin d’un résultat concret pour vous sentir motivé(e) ?"],
      ["obj","Est-ce que la performance pour vous s’évalue par l’atteinte d’un résultat plutôt que par ce que vous avez appris ?"],
      ["obj","Planifiez-vous vos actions avec une idée précise du résultat attendu ?"],

      ["aff","Est-il important pour vous d’être bien intégré(e) dans un groupe ?"],

      ["vs","Faites-vous passer vos besoins en premier dans un groupe ?"],
      ["va","Anticipez-vous souvent les besoins ou attentes des autres ?"],
      ["va","Vos choix sont-ils souvent guidés par le plaisir que cela procurera aux autres ?"],
      ["va","Préférez-vous faire plaisir quitte à vous contraindre un peu ?"],
      ["va","Vous sentez-vous responsable du bien-être des autres ?"],
      ["va","Est-il important pour vous d’être perçu(e) comme quelqu’un d’attentionné ?"],
      ["gbl","Aimez-vous comprendre les grandes lignes avant d’entrer dans les détails ?"],
      ["gbl","Préférez-vous les visions d’ensemble aux explications minutieuses ?"],
      ["gbl","Avez-vous besoin de situer les choses dans un cadre général ?"],
      ["gbl","Est-ce que les détails vous intéressent surtout une fois la vue d’ensemble comprise ?"],

      ["d","Aimez-vous décortiquer les choses en éléments précis ?"],
      ["d","Sur un mur nouvellement peint, allez-vous voir instantanément le petit détail mal fait ?"],
      ["d","Vous attachez-vous aux détails avant d’embrasser une vision globale ?"],

    // Question courante, qui sera incrémentée au fur et à mesure

    // Fonction de mélange aléatoire
    function shuffleArray(arr) {
      let a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    
    // Questions qui seront affichées aléatoirement

    // questions[index][0] = métaprogramme (v, a, k, o, g, proc, ...)
    // questions[index][1] = intitulé de la question

    // Vérifie si une réponse a été sélectionnée
    let selected = null; // Par défaut, aucune réponse sélectionnée
    
    const exampleSegments = [
      "Votre profil amoureux révèle une énergie singulière. Si la Motivation Pouvoir domine, vous êtes attiré(e) par l’influence et l’affirmation de soi, ce qui peut séduire mais aussi générer des tensions si votre partenaire partage la même intensité. L’équilibre naît lorsque Pouvoir rencontre Objectif ou Affiliation, car l’un apporte direction et l’autre connexion. Un Objectif dominant offre clarté et progression, idéalement complété par une Affiliation chaleureuse qui renforce la complicité.",

      "Enfin, votre rapport au Temps et à l’Énergie influence la compatibilité. Deux Présents vivent une intensité grisée, mais peuvent manquer de projection. Le Passé s’attache aux racines, le Futur bâtit des projets : ces visions différentes nécessitent dialogue pour s’harmoniser. Côté Énergie, deux Introvertis s’accordent dans une bulle intime, deux Extravertis partagent une complicité vive. Les écarts trop marqués (60%+ Introverti vs 60%+ Extraverti) exigent plus d’efforts de compréhension."
    ];

    // Variables DOM HTML
    const qCard = document.getElementById('question-card'); // bloc HTML correspondant à la carte de la question
    const qNumber = document.getElementById('question-number'); // numéro de la question
    const qText = document.getElementById('question-text'); // texte de la question (intitulé)
    const answerBtns = Array.from(document.getElementsByClassName('answer-btn')); // tableau des boutons de réponses
    const nextBtn = document.getElementById('next-btn'); // bouton suivant
    const alertBox = document.getElementById('alert'); // message d'alerte en cas d'erreur

    const emailInput = document.getElementById('email'); // champ email du formulaire
    const consentBox = document.getElementById('consent'); // checkbox de consentement
    const emailDupMsg = document.getElementById('email-duplicate-msg'); // message d'erreur si le mail a déjà été utilisé
    const successMsg = document.getElementById('success-msg'); // message en cas de succès
    const errorMsg = document.getElementById('error-msg'); // message en cas d'erreur
    const submitBtn = document.getElementById('submit-btn'); // bouton d'envoi du formulaire(envoi des résultats après avoir indiqué le mail)
    const submitSpinner = document.getElementById('submit-spinner'); // loader

    let isSubmitting = false; // Par défaut, formulaire et résultats non envoyés

    // Fonction d'affichage des questions
    function showQuestion(idx) {
      // On masque la carte par un effet de fondu
      qCard.classList.add('question-fade');
      setTimeout(()=>{
        // On affiche le numéro de la question en cours
        qNumber.textContent = (idx+1) + ".";
        // On affiche l'intitulé de la question
        qText.textContent = questions[idx][1];
        // On affiche les boutons des réponses, en les désélectionnant
        answerBtns.forEach(btn => btn.classList.remove('selected'));
        selected = null;
        // On masque le message d'alerte éventuel
        alertBox.classList.remove('show-alert');
        // On supprime la classe masquant la carte pour la réafficher, maintenant qu'elle a été mise à jour
        qCard.classList.remove('question-fade');
        // On fait avancer la barre de progression
        progressBar.style.width = ((idx/105)*100).toFixed(2) + "%";
      }, 210);
    } // Fin de fonction (affichag d'une question)

    // On affiche la première question :
    showQuestion(0);

    // Pour chaque bouton de réponse
    answerBtns.forEach(btn => {
      // On ajoute un écouteur d'évènement : dès qu'on clique sur une réponse
      btn.addEventListener('click', function() {
        // On déselectionne toutes les réponses afin de mettre à jour (s'il y a changement de réponse)
        answerBtns.forEach(b=>b.classList.remove('selected'));
        // On sélectionne l'élément qui vient d'être cliqué
        this.classList.add('selected');
        // On récupère la valeur/pondération de la réponse choisie (0, 25, 75 ou 100), de l'attribut data-value correspondant
        selected = parseInt(this.dataset.value);
        // On masque le message d'alert s'il était affiché
        alertBox.classList.remove('show-alert');
      });
    }); // Fin de fonction (boutons de réponses)

    // Lorsque l'on clique sur le bouton "Suivant"
    nextBtn.addEventListener('click', function() {
      // Si aucune réponse n'a été sélectionnée
      if(selected === null){
        // On affiche l'alerte
        alertBox.classList.add('show-alert');
        return; // On quitte la fonction
      }
      // Si une réponse a été sélectionnée
      /* ANCIENNE MÉTHODE : answers[currentQ] = { pan: questions[currentQ][0], value: selected }; */
      
      // On incrémente de la valeur de la réponse sélectionnée le score correspondant au métaprogramme de la question
      GLOBAL_SCORES[questions[currentQ][0]] += selected;
      // On incrémente le compteur des questions pour passer à la suivante
      currentQ++;
      // Si toutes les questions n'ont pas encore été affichées, on affiche la question en cours
      if(currentQ < questions.length){
        showQuestion(currentQ);
      }else{
        // Plus aucune question à afficher
        // On masque la carte de la question par un effet de fondu
        qCard.classList.add('question-fade');
        setTimeout(()=>{
          qCard.style.display = 'none';
          // On affiche le bloc pour l'envoi des résultats (formulaire avec l'email)
          resultBlock.style.display = 'flex';
          // Barre de progression à 100% : test terminé
          progressBar.style.width = "100%";
          // Si le message sous le titre existe, on le masque
          if (inspiration) inspiration.classList.add('hide');
          // Peu importe où l'on se trouve dans le scroll de la page, on remonte tout en haut
          window.scrollTo({top:0,behavior:'smooth'});
        },300);
      }
    }); // Fin de fonction (clic sur le bouton "Suivant")

    showQuestion(0);

    // Fonction qui retourne le pan correspondant à un métaprogramme
    function getPan(meta) {
      // Pour chaque association [clé, valeur] ([pan, liste des métaprogrammes associés]) de l'objet GLOBAL_PANS
      for (const [pan, metas] of Object.entries(GLOBAL_PANS)) {
        // Si la liste des métaprogrammes contien le métaprogramme recherché (en paramètre)
        if (metas.includes(meta)) {
          return pan; // On retourne le nom du pan (clé)
        }
      }
      return null;
    }; // Fin de fonction (récuparation du nom du pan)

    /*
     *
     * Fonction récupérant le nombre de questions pour chaque Pan
     */
    function totalQuestionsPan(pan) {
      // On récupère la liste des métaprogrammes du pan en paramètre
      const metas = GLOBAL_PANS[pan];
      if (!metas) return 0; // Si aucun métaprogramme, on renvoie 0
      
      // On crée un filtre, qui ne conservera que les questions dont le métaprogramme appartient au pan (métaprogramme inclus dans la liste des métaprogrammes du pan)
      // On vérifie pour chaque question (q) en cours que le premier élément (q[0]) — donc le métaprogramme — fait partie de la liste des métaprogrammes du pan
      // Si le filtre est valide (le métaprogramme appartient bien au pan), alors on stocke la question dans le tableau
      return allQuestions.filter(q => metas.includes(q[0])).length; // On renvoie la longueur du tableau (nombre de questions stockées/filtrées)
    }; // Fin  de fonction (nombre total de questions d'un pan donné)

    /*
     *
     * Fonction récupérant le nombre de questions pour chaque métaprogramme
     */
    function totalQuestionsMeta(meta) {
/*

DEBUG 12/02/2026
MISE EN COMMENTAIRE
AJOUT DU RETURN allQuestions.filter(q => q[0] === meta).length;

      const totalQuestions = {}; // Objet qui contiendra, pour chaque métaprogramme, le nombre total de questions correspondantes
      
      // Pour chaque question de la liste initiale, on compte le nombre de questions
      allQuestions.forEach( ([meta]) => {
        totalQuestions[meta] = (totalQuestions[meta] || 0) + 1; // On incrémente (en partant de 0 si aucune itération du métaprogramme en cours n'est pas encore apparue)
      });
      //return totalQuestions;

      
/ DEBUG 12/02/2026

  */
      return allQuestions.filter(q => q[0] === meta).length;
    }; // Fin  de fonction (nombre total de questions d'un métaprogramme donné)

    /*
     *
     * Fonction permettant de calculer les résultats donnés
     * pour chaque métaprogramme
     */
    function computeResults() {
      /*
       *
      ANCIENNE MÉTHODE DE CALCUL (PONDÉRATION PAR MÉTAPROGRAMME INDIVIDUEL AU LIEU DU PAN ENTIER
      
      const totalQuestions = {}; // Objet qui contiendra, pour chaque métaprogramme, le nombre total de questions correspondantes
      
      
      // Pour chaque question de la liste initiale, on compte le nombre de questions
      allQuestions.forEach( ([meta]) => {
        totalQuestions[meta] = (totalQuestions[meta] || 0) + 1; // On incrémente (en partant de 0 si aucune itération du métaprogramme en cours n'est pas encore apparue)
      });

      *
      */
      
      // On récupère, pour chaque métaprogramme, le score correspondant pondéré par rapport au pan auquel il appartient :
      const metaScores = {}; // Contiendra le score calculé pour chaque métaprogramme

      // Pour chaque entrée (métaprogramme) des scores, on calcule le pourcentage
      Object.keys(GLOBAL_SCORES).forEach( meta => {
        // Le pourcentage calculé du métaprogramme = score du métaprogramme divisé par le nombre total de questions du métaprogramme fois 100 (= moyenne)
        // Le tout multiplié par 100 pour avoir le pourcentage
        // S'il n'y a aucune question pour un pan, alors le résultat sera 0 (division par 0 impossible)
        /*
         * ANCIENNE MÉTHODE : SCORE DU MÉTAPROGRAMME PAR RAPPORT AU PAN COMPLET
         *
         * metaScores[meta] = (totalQuestionsPan(getPan(meta)) == 0 ) ? 0 : Math.round(( GLOBAL_SCORES[meta] / ( totalQuestionsPan(getPan(meta)) * 100 ) ) * 100);
         */
        metaScores[meta] = (totalQuestionsMeta(meta) == 0 ) ? 0 : Math.round(( GLOBAL_SCORES[meta] / ( totalQuestionsMeta(meta) * 100 ) ) * 100);
      });
      
      
      // On renvoie le résultat des scores
      return metaScores;
    } // Fin de fonction (calcul des résultats)

    /*
     * Fonction permettant de calculer le score total (/100) d'un pan complet, quel que soit le nombre de métaprogrammes qu'il contient
     * et peu importe le nombre de questions associées
     */
    function computePanResults() {

      const panScores = {}; // Tableau qui contiendra les différents scores de chaque pan
    
      // Pour chaque pan
      Object.keys(GLOBAL_PANS).forEach(pan => {
    
        const metas = GLOBAL_PANS[pan]; // On récupère les métaprogrammes correspondants
    
        // On récupère la somme totale brute des scores obtenus dans tous les métaprogrammes
        // Par exemple, pour le pan VAKOG, on récupère la somme totale des scores des métaprogrammes V + A + K + O + G
        const totalBrut = metas.reduce((sum, meta) => {
          return sum + (GLOBAL_SCORES[meta] || 0);
        }, 0);
    
        // Nombre total de questions du pan complet
        const totalQuestions = totalQuestionsPan(pan);
    
        // Score maximum possible
        // Par exemple, si 15 questions (3 métaprogrammes de 5 questions chacun),
        // Le score maximal étant 100 (note de 0, 25, 75 ou 100) pour chaque question, la note max d'un pan serait 15 x 100 = 1500
        const maxBrut = totalQuestions * 100;
    
        // On calcule le score du pan
        // Si aucune question, on retourne 0
        // Sinon, on calcule le total obtenu / note maximale possible, et on multiplie par 100 pour ramener le tout sur 100 et avoir le pourcentage
        const scorePan = ( maxBrut === 0 ) ? 0 : Math.round((totalBrut / maxBrut) * 100);

        // On affecte le score du pan dans le tableau des scores/pan
        panScores[pan] = scorePan;
      });

      // On retourne le tableau des scores/pan
      return panScores;
    } // Fin de fonction (calcul du score d'un pan complet)
    
    function buildInterpretationSegments(scores, partIdx){
      return exampleSegments[partIdx];
    }

    // Fonction construisant l'objet à renvoyer au webhook

      return {

        "segments_part1": buildInterpretationSegments(scores,0),
        "segments_part2": buildInterpretationSegments(scores,1),
        "segments_part3": buildInterpretationSegments(scores,2),
        "segments_part4": buildInterpretationSegments(scores,3)
      };
    } // Fin de fonction (construction de l'objet à retourner au webhook)

    function validateEmail(email) {
      // Simple RFC5322 version
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function submitFormHandler(e) {
      e.preventDefault();
      if (isSubmitting) return;

      emailDupMsg.style.display = 'none';
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      errorMsg.textContent = '';

      const email = emailInput.value.trim();
      const consent = consentBox.checked;

      if(!email){
        errorMsg.textContent = "Merci d'indiquer votre adresse e-mail.";
        errorMsg.style.display = 'block';
        emailInput.focus();
        return;
      }
      if(!validateEmail(email)){
        errorMsg.textContent = "Merci d'indiquer une adresse e-mail valide.";
        errorMsg.style.display = 'block';
        emailInput.focus();
        return;
      }
      if(!consent){
        errorMsg.textContent = "Merci de cocher la case de consentement.";
        errorMsg.style.display = 'block';
        consentBox.focus();
        return;
      }

      isSubmitting = true;
      submitBtn.disabled = true;
      submitSpinner.style.display = 'inline-block';

      const payload = buildPayload(email);

      //console.log("[Form] Submission started. Payload:", payload);

      let timeoutId;
      try {
        const controller = new AbortController();
        timeoutId = setTimeout(() => controller.abort(), 15000);

        const response = await fetch("https://hook.eu2.make.com/tijjob8xra3pn28g9wqabsfp684jg3dy", {
          method:"POST",
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const responseText = await response.text();
        console.log("[Form] Raw response:", responseText);

        if(responseText.includes("duplicate")){
          emailDupMsg.textContent = "⚠️ Cette adresse e-mail a déjà servi pour un test 💡. Merci d’en indiquer une autre afin de recevoir une nouvelle interprétation.";
          emailDupMsg.style.display = 'block';
        } else if(responseText.includes("captcha_failed")){
          errorMsg.textContent = "Captcha invalide. Merci de réessayer.";
          errorMsg.style.display = 'block';
          alert("Captcha invalide. Merci de réessayer.");
        } else {
          Array.from(resultBlock.querySelectorAll('input,button')).forEach(el=>el.style.display='none');
          successMsg.textContent = "Merci ❤️ Votre analyse personnalisée a été envoyée à " + email + "(pensez à vérifier vos spams).";
          successMsg.style.display = 'block';
          setTimeout(() => {
            resultBlock.reset && resultBlock.reset();
            isSubmitting = false;
          }, 500);
        }
      } catch(fetchErr) {
        clearTimeout(timeoutId);
        if (fetchErr.name === "AbortError") {
          errorMsg.textContent = "Le serveur ne répond pas. Merci de réessayer dans quelques instants.";
        } else {
          errorMsg.textContent = "Erreur réseau. Veuillez réessayer dans quelques instants.";
        }
        errorMsg.style.display = 'block';
        console.error("[Form] Fetch/network error:", fetchErr);
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitSpinner.style.display = 'none';
      }
    }

    resultBlock.addEventListener('submit', submitFormHandler);

    document.addEventListener('keydown', function(e){
      if(qCard.style.display!=='none' && (e.key==="Enter" || e.keyCode===13)){
        if(selected!==null){
          nextBtn.click();
          e.preventDefault();
        }
      }
    });

    emailInput.addEventListener('keydown', function(e){
      if(e.key === "Enter") e.preventDefault();
    });
    emailInput.addEventListener('input',()=>{emailDupMsg.style.display='none';});

    window.addEventListener('pageshow', function(){
      resultBlock.style.display = 'none';
      qCard.style.display = '';
      currentQ = 0;
      answers = [];
      showQuestion(0);
      progressBar.style.width = "0%";
      if (inspiration) inspiration.classList.remove('hide');
    });

    window.addEventListener('DOMContentLoaded', function() {
      submitSpinner.style.display = 'none';
      errorMsg.style.display = 'none';
      isSubmitting = false;
      submitBtn.disabled = false;
    });
  </script>
